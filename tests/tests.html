<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>RUNNING — Hrodic's Mafia 2D tests</title>
  <style>
    :root {
      color-scheme: dark;
    }
    * {
      box-sizing: border-box;
    }
    body {
      margin: 0;
      min-height: 100vh;
      background: #09090b;
      color: #e4e4e7;
      font-family: ui-monospace, 'Cascadia Mono', Consolas, monospace;
      padding: 24px;
    }
    main {
      max-width: 960px;
      margin: 0 auto;
    }
    h1 {
      font-size: 18px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: #fbbf24;
      margin: 0 0 4px;
    }
    .hint {
      color: #71717a;
      font-size: 12px;
      margin: 0 0 16px;
      line-height: 1.6;
    }
    .summary {
      border-radius: 8px;
      padding: 10px 14px;
      font-weight: 700;
      margin-bottom: 16px;
      border: 1px solid #3f3f46;
      background: #18181b;
      color: #a1a1aa;
    }
    .summary.pass {
      border-color: #059669;
      background: #022c22;
      color: #6ee7b7;
    }
    .summary.fail {
      border-color: #e11d48;
      background: #4c0519;
      color: #fda4af;
    }
    #test-results {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }
    .test-row {
      display: flex;
      flex-wrap: wrap;
      align-items: baseline;
      gap: 8px;
      padding: 6px 10px;
      border-radius: 6px;
      background: #18181b;
      border: 1px solid #27272a;
      font-size: 13px;
    }
    .test-row.pass {
      border-color: #14532d;
    }
    .test-row.fail {
      border-color: #7f1d1d;
      background: #1c0a0a;
    }
    .test-mark {
      width: 16px;
      text-align: center;
      font-weight: 700;
    }
    .test-row.pass .test-mark {
      color: #34d399;
    }
    .test-row.fail .test-mark {
      color: #fb7185;
    }
    .test-error {
      flex-basis: 100%;
      margin: 4px 0 0;
      padding: 8px 10px;
      border-radius: 6px;
      background: #09090b;
      color: #fda4af;
      font-size: 11px;
      line-height: 1.5;
      white-space: pre-wrap;
      overflow-x: auto;
    }
  </style>
</head>
<body>
  <main>
    <h1>Hrodic's Mafia 2D — Test Suite</h1>
    <p class="hint">
      Zero-dependency browser tests. Must be served over http:// (ES modules do not load
      from file://). Green list + page title <strong>PASS</strong> means everything is fine.
    </p>
    <div id="test-summary" class="summary">Running…</div>
    <div id="test-results"></div>
    <!-- Hidden game-sized canvas so render modules can be tested in this page. -->
    <div style="display: none" aria-hidden="true">
      <canvas id="gameCanvas"></canvas>
      <canvas id="minimapCanvas" width="140" height="140"></canvas>
      <span id="minimap-coords"></span>
      <button id="world-seed-hud" class="hidden"></button>
      <span id="last-world-seed"></span>
      <input id="world-seed-input" />
      <input id="map-size-slider" type="range" />
      <span id="map-size-display"></span>
      <div id="map-cap-preview"></div>
      <div id="match-impact-summary"></div>
      <input id="tick-speed-slider" type="range" min="10" max="30" value="10" />
      <span id="tick-speed-display"></span>
      <span id="income-tier-display"></span>
      <button type="button" class="income-tier-btn" data-income="LOW"></button>
      <button type="button" class="income-tier-btn" data-income="MID"></button>
      <button type="button" class="income-tier-btn" data-income="HIGH"></button>
      <button type="button" class="match-preset" data-preset="turbo" aria-pressed="false"></button>
      <button type="button" class="match-preset" data-preset="normal" aria-pressed="false"></button>
      <button type="button" class="match-preset" data-preset="long" aria-pressed="false"></button>
      <input id="setup-cap-soldier" type="range" min="10" max="150" value="150" />
    <span id="setup-rank-soldier"></span>
    <span id="setup-rank-captain"></span>
    <span id="setup-rank-underboss"></span>
      <input id="setup-cap-captain" type="range" min="2" max="30" value="30" />
      <input id="setup-cap-underboss" type="range" min="1" max="15" value="15" />
      <span id="setup-cap-soldier-value"></span>
      <span id="setup-cap-captain-value"></span>
      <span id="setup-cap-underboss-value"></span>
      <span id="setup-cap-soldier-ceiling"></span>
      <span id="setup-cap-captain-ceiling"></span>
      <span id="setup-cap-underboss-ceiling"></span>
      <div id="faction-slots-container"></div>
      <span id="stats-badge"></span>
      <div id="hp-bar-fill"></div><span id="hp-text"></span>
      <span id="cash-text"></span><span id="hour-text"></span>
      <div id="tick-bar-fill"></div>
      <div id="armor-hud-box"></div><div id="armor-bar-fill"></div><span id="armor-text"></span>
      <div id="faction-board">
        <div class="faction-board-header">
          <span>Faction Leaderboard</span>
          <span id="faction-count-label"></span>
          <button id="btn-faction-collapse" aria-expanded="true">▴</button>
        </div>
        <div id="faction-board-body"></div>
      </div>
      <button id="btn-slash"><span id="cooldown-slash"></span><span id="action-status-slash"></span></button>
      <button id="btn-pistol"><span id="cooldown-pistol"></span><span id="action-status-pistol"></span><span id="ammo-pistol"></span><span id="action-label-pistol"></span></button>
      <button id="btn-buy-armor"><span id="cooldown-armor"></span><span id="action-status-armor"></span></button>
      <button id="btn-sprint"><span id="cooldown-sprint"></span><span id="action-status-sprint"></span><div id="sprint-bar-fill"></div><span id="sprint-text"></span></button>
      <section id="management-panel">
        <div id="management-body"></div>
        <button id="btn-management-collapse" aria-expanded="true"></button>
      </section>
      <button id="btn-toggle-soldier"></button>
      <button id="btn-toggle-captain"></button>
      <button id="btn-toggle-underboss"></button>
      <span id="mgmt-rank-soldier"></span><span id="mgmt-rank-captain"></span><span id="mgmt-rank-underboss"></span>
      <span id="mgmt-auto-soldier"></span><span id="mgmt-auto-captain"></span><span id="mgmt-auto-underboss"></span>
      <button id="btn-cap-soldier-min"></button><button id="btn-cap-soldier-dec"></button><button id="btn-cap-soldier-inc"></button><button id="btn-cap-soldier-max"></button>
      <button id="btn-cap-captain-min"></button><button id="btn-cap-captain-dec"></button><button id="btn-cap-captain-inc"></button><button id="btn-cap-captain-max"></button>
      <button id="btn-cap-underboss-min"></button><button id="btn-cap-underboss-dec"></button><button id="btn-cap-underboss-inc"></button><button id="btn-cap-underboss-max"></button>
      <span id="cap-soldier-label"></span><span id="cap-captain-label"></span><span id="cap-underboss-label"></span>
      <span id="mgmt-total-upkeep"></span>
      <span id="mgmt-total-gross"></span>
      <span id="mgmt-total-turf"></span>
      <span id="mgmt-total-crew"></span>
      <span id="mgmt-total-corruption"></span>
      <span id="mgmt-corruption-breakdown"></span>
      <span id="mgmt-total-net"></span>
      <div id="toast"></div>
      <div id="defeat-banner" class="hidden"></div>
      <div id="victory-banner" class="hidden"></div>
      <div id="spectator-banner" class="hidden"></div>
      <span id="victory-summary"></span>
      <div id="hour-hud-box"></div>
    </div>
  </main>
  <script type="module" src="./runner.js"></script>
  <script>
    // Watchdog: module load failures (e.g. a 404 import) never reach the runner,
    // so report them instead of leaving the page stuck on "Running…".
    window.addEventListener('load', () => {
      setTimeout(() => {
        if (window.__TEST_RESULTS__) return;
        const summary = document.getElementById('test-summary');
        summary.textContent = 'FAIL: test modules failed to load (check the console for the import error)';
        summary.className = 'summary fail';
        document.title = 'FAIL — test modules did not load';
      }, 4000);
    });
  </script>
</body>
</html>
